{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}STA{% endblock %}</title>

    <!-- Tailwind compilé -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:'DM Sans', sans-serif;
            background:#F4F4F7;
            color:#0A0A0F;
        }

        h1,h2,h3,h4{
            font-family:'Syne', sans-serif;
        }

        .auth-card{
            background:white;
            border:1px solid #E2E2EA;
            border-radius:1.5rem;
            box-shadow:0 4px 30px rgba(0,0,0,.05);
        }

        .input-auth{
            width:100%;
            border:1.5px solid #E2E2EA;
            border-radius:0.9rem;
            padding:0.75rem 1rem;
            font-size:.9rem;
            outline:none;
            transition:all .2s ease;
            background:white;
        }

        .input-auth:focus{
            border-color:#2563EB;
            box-shadow:0 0 0 4px rgba(37,99,235,.12);
        }

        .btn-auth{
            background:#0A0A0F;
            color:white;
            border-radius:0.9rem;
            padding:.9rem 1rem;
            width:100%;
            font-weight:600;
            transition:all .2s ease;
        }

        .btn-auth:hover{
            transform:translateY(-1px);
            background:#1B1B24;
        }

        .fade-in{
            animation:fadeIn .35s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(10px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }
    </style>

</head>

<body>

    <div class="min-h-screen flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-md">

            <!-- Logo -->
            <div class="flex justify-center mb-8 fade-in">

                <a href="/" class="flex items-center gap-3">

                    <div class="w-11 h-11 rounded-2xl bg-[#0A0A0F] flex items-center justify-center shadow-sm">

                        <!-- Logo SVG -->
                        <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
                            <rect x="2" y="2" width="5" height="5" rx="1" fill="white"/>
                            <rect x="9" y="2" width="5" height="5" rx="1" fill="white" opacity=".7"/>
                            <rect x="2" y="9" width="5" height="5" rx="1" fill="white" opacity=".7"/>
                            <rect x="9" y="9" width="5" height="5" rx="1" fill="white" opacity=".4"/>
                        </svg>

                    </div>

                    <span class="text-xl font-extrabold tracking-tight">
                        STA
                    </span>

                </a>

            </div>

            <!-- CONTENT -->
            <div class="auth-card p-8 fade-in">

                {% block content %}
                {% endblock %}

            </div>

        </div>

    </div>

</body>
</html>
